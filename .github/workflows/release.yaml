name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Read Flix version from flix.toml
        id: flix
        run: |
          version=$(grep -E '^"?flix"?[[:space:]]*=' flix.toml \
            | head -n1 \
            | sed -E 's/.*"([^"]+)"[[:space:]]*$/\1/')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download Flix
        run: |
          curl -fsSL -o flix.jar \
            "https://github.com/flix/flix/releases/download/v${{ steps.flix.outputs.version }}/flix.jar"

      - name: Check and test package
        run: |
          java -jar flix.jar check
          java -jar flix.jar test

      - name: Build Flix package
        run: java -jar flix.jar build-pkg

      - name: Publish package assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifact/*.fpkg artifact/flix.toml --clobber
          else
            gh release create "$TAG" artifact/*.fpkg artifact/flix.toml \
              --verify-tag --generate-notes --title "$TAG"
          fi
